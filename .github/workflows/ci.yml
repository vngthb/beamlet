name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        otp: ['27', '28', '29']
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: '3.27.0'
      - run: rebar3 fmt --check
      - run: rebar3 lint
      - run: rebar3 compile
      - run: rebar3 eunit
      - run: rebar3 dialyzer
      - run: docker info
      - run: rebar3 as integration ct
        env:
          BEAMLET_INTEGRATION: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ct-logs-otp-${{ matrix.otp }}
          path: _build/**/logs
